    <!-- Polyfill/setter patch to allow browser extensions and interceptors to reassign window.fetch without getter-only errors -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // silently handle if window is already restricted
        }
      })();
    </script>
