<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Outer badge gradient -->
    <linearGradient id="scbnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF8" />
      <stop offset="45%" stop-color="#6955E8" />
      <stop offset="100%" stop-color="#432CB8" />
    </linearGradient>

    <!-- Ring shimmer gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Bus body gradient -->
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Bus roof / accent gradient -->
    <linearGradient id="busAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Windshield gradient -->
    <linearGradient id="windshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glow shadow filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5538C8" flood-opacity="0.38" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Glow & Base Badge -->
  <circle cx="60" cy="60" r="54" fill="url(#scbnBg)" filter="url(#badgeGlow)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Background Decorative Orbit Lines (Smart Network) -->
  <path d="M18 64 C35 50, 85 50, 102 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.8" stroke-dasharray="3 3" />
  <path d="M14 74 C40 86, 80 86, 106 74" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2" />
  <circle cx="24" cy="71" r="2" fill="#67E8F9" />
  <circle cx="96" cy="71" r="2" fill="#34D399" />

  <!-- Smart Signal Waves (Top telemetry broadcast) -->
  <path d="M47 31 C55 26, 65 26, 73 31" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.95" />
  <path d="M52 36 C57 33, 63 33, 68 36" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" opacity="0.95" />
  <circle cx="60" cy="40.5" r="1.8" fill="#FDE047" />

  <!-- Cute Star Accents -->
  <path d="M28 36 L29 32 L33 31 L29 30 L28 26 L27 30 L23 31 L27 32 Z" fill="#FDE047" opacity="0.85" />
  <path d="M92 40 L93 37 L96 36 L93 35 L92 32 L91 35 L88 36 L91 37 Z" fill="#67E8F9" opacity="0.85" />

  <!-- Roadway Arc under bus -->
  <path d="M22 84 C42 93, 78 93, 98 84" fill="none" stroke="#DDD6FE" stroke-opacity="0.4" stroke-width="4.5" stroke-linecap="round" />
  <path d="M32 87 C48 93, 72 93, 88 87" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 4" />

  <!-- Cute Modern Transit Bus Group -->
  <g filter="url(#softShadow)">
    <!-- Bus Main Body with rounded friendly corners -->
    <rect x="36" y="44" width="48" height="34" rx="10" fill="url(#busBody)" />

    <!-- Cute Colored Top Cap / Route Header -->
    <path d="M37 53 C37 46, 43 45, 48 45 L72 45 C77 45, 83 46, 83 53 Z" fill="url(#busAccent)" />

    <!-- Destination Sign Pill -->
    <rect x="49" y="46.5" width="22" height="4.5" rx="2.2" fill="#0F172A" />
    <text x="60" y="50" font-family="'Manrope', -apple-system, sans-serif" font-size="3.2" font-weight="900" fill="#67E8F9" text-anchor="middle" letter-spacing="0.6">SCBN</text>

    <!-- Windshield with cute rounded look and divider -->
    <rect x="40" y="54" width="40" height="12" rx="4" fill="url(#windshield)" />

    <!-- Windshield Reflection Highlight -->
    <path d="M42 56 L47 56 L44 64 L41 64 Z" fill="#FFFFFF" fill-opacity="0.35" />
    <path d="M49 56 L52 56 L50 64 L47 64 Z" fill="#FFFFFF" fill-opacity="0.2" />

    <!-- Friendly Headlights (Warm bright rounded eyes) -->
    <circle cx="43.5" cy="70" r="3" fill="#FEF08A" />
    <circle cx="43.5" cy="70" r="1.5" fill="#EAB308" />
    <circle cx="76.5" cy="70" r="3" fill="#FEF08A" />
    <circle cx="76.5" cy="70" r="1.5" fill="#EAB308" />

    <!-- Front Grille Smile -->
    <rect x="52" y="69.5" width="16" height="2.5" rx="1.25" fill="#C4B5FD" />
    <line x1="56" y1="70.7" x2="64" y2="70.7" stroke="#7C3AED" stroke-width="0.8" stroke-linecap="round" />

    <!-- Bus Wheels (Cute Chunky Wheels) -->
    <g transform="translate(43, 77)">
      <circle cx="0" cy="0" r="4.5" fill="#1E1B4B" />
      <circle cx="0" cy="0" r="2.2" fill="#E2E8F0" />
      <circle cx="0" cy="0" r="1" fill="#7164ED" />
    </g>
    <g transform="translate(77, 77)">
      <circle cx="0" cy="0" r="4.5" fill="#1E1B4B" />
      <circle cx="0" cy="0" r="2.2" fill="#E2E8F0" />
      <circle cx="0" cy="0" r="1" fill="#7164ED" />
    </g>

    <!-- Bumper -->
    <rect x="39" y="74" width="42" height="2.2" rx="1.1" fill="#CBD5E1" />
  </g>
</svg>
